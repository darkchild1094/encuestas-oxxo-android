android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.experimental.runLintInProcess=true

# AGP 8.5 no "conoce" oficialmente el SDK 35 (aviso ruidoso). Compila
# bien contra 35 -- que Play ya exige como target. Quitar este flag
# cuando se suba el Android Gradle Plugin a 8.6+.
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
